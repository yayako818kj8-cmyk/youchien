
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横スクロールマンガ</title>

<style>
  /* ===== 基本 ===== */
  body {
    margin: 0;
    overflow: hidden;
    background: #fff;
  }

  /* ===== 読了率バー ===== */
  #progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 6px;
    width: 100%;
    background: rgba(0, 0, 0, 0.15);
    z-index: 1000;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: #00ccaa;
    transition: width 0.1s;
  }

  /* ===== マンガコンテナ ===== */
  #container {
    display: flex;
    flex-direction: row-reverse;
    height: 100vh;

    overflow-x: scroll;
    overflow-y: hidden;

    scroll-behavior: smooth;
    background: #fff;
  }

  /* ===== 1コマ ===== */
  .page {
    flex: 0 0 100vw;
    height: 100vh;
    background: #fff;
  }

  .page img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
</style>
</head>

<body>

<!-- 読了率バー -->
<div id="progress">
  <div id="progress-bar"></div>
</div>

<!-- マンガ本体 -->
<div id="container"></div>

<script>
const container = document.getElementById("container");
const progressBar = document.getElementById("progress-bar");

/* ===== マンガ画像を読み込む ===== */
fetch("./youchien.txt")
  .then(res => {
    if (!res.ok) {
      throw new Error(
        "youchien.txt の読み込みに失敗しました：" + res.status
      );
    }
    return res.json();
  })
  .then(data => {
    data.forEach(file => {
      const page = document.createElement("div");
      page.className = "page";

      const img = document.createElement("img");
      img.src = "./YouchienBoueigumi/" + file;
      img.alt = file;

      img.onerror = () => {
        console.error("画像を読み込めませんでした：", img.src);
      };

      page.appendChild(img);
      container.appendChild(page);
    });

    updateProgress();
  })
  .catch(error => {
    console.error("読み込みエラー：", error);

    const message = document.createElement("p");
    message.style.color = "#000";
    message.style.padding = "20px";
    message.textContent =
      "マンガを読み込めませんでした。ファイル名と保存場所を確認してください。";

    document.body.appendChild(message);
  });

/* ===== 読了率計算 ===== */
function updateProgress() {
  const maxScroll =
    container.scrollWidth - container.clientWidth;

  if (maxScroll <= 0) {
    progressBar.style.width = "100%";
    return;
  }

  const progress =
    1 - container.scrollLeft / maxScroll;

  progressBar.style.width =
    Math.max(0, Math.min(progress * 100, 100)) + "%";
}

container.addEventListener("scroll", updateProgress);
</script>

</body>
</html>
